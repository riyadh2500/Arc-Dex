<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- Dark rounded background -->
  <rect width="200" height="200" rx="22" fill="#070910"/>

  <!--
    AD Monogram — elegant thin-stroke serif style
    A: tall italic triangle with thin legs and crossbar
    D: large D whose stem overlaps A, with elegant curved bowl
  -->

  <!-- ── A ─────────────────────────────────────────────────────── -->
  <!-- Left leg -->
  <path d="M 48 168  L 85 32  L 91 32  L 56 168 Z" fill="white"/>
  <!-- Right leg -->
  <path d="M 85 32   L 91 32  L 128 168  L 122 168 Z" fill="white"/>
  <!-- Crossbar -->
  <path d="M 63 120  L 115 112  L 116 119  L 64 127 Z" fill="white"/>
  <!-- Serif flicks at foot of A left -->
  <path d="M 44 168  L 60 168  L 58 163  L 46 163 Z" fill="white"/>
  <!-- Serif flicks at foot of A right -->
  <path d="M 120 168 L 136 168 L 134 163 L 122 163 Z" fill="white"/>

  <!-- ── D ─────────────────────────────────────────────────────── -->
  <!-- Stem (overlaps A) -->
  <path d="M 84 32   L 90 32   L 90 168   L 84 168 Z" fill="white"/>
  <!-- Bowl of D — thin stroked arc -->
  <path
    d="M 87 38
       Q 170 38  170 100
       Q 170 168  87 162"
    fill="none"
    stroke="white"
    stroke-width="6"
    stroke-linecap="round"
  />
  <!-- Serif top of D stem -->
  <path d="M 78 32 L 96 32 L 96 38 L 78 38 Z" fill="white"/>
  <!-- Serif bottom of D stem -->
  <path d="M 78 162 L 96 162 L 96 168 L 78 168 Z" fill="white"/>

</svg>
